# Two services on a private network:
#   postgres — dedicated Postgres 16 with a persistent volume
#   mcp      — the coach-memory MCP server (streamable-HTTP on :8000)
#
# The mcp port is published only on 127.0.0.1 — Nginx (on the host) terminates
# TLS for coach-memory.rcmlearning.com and reverse-proxies to it. See README.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  mcp:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # host-loopback only; Nginx sits in front (do NOT expose 0.0.0.0)
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]
    restart: unless-stopped

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
